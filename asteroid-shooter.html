<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroid Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; border: 1px solid #1a1a3a; }
        #hud {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 60px;
            color: #cce;
            font-size: 16px;
            letter-spacing: 2px;
            pointer-events: none;
        }
        #hud span { color: #fff; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
    <div>SCORE <span id="scoreVal">0</span></div>
    <div>SHIELDS <span id="shieldsVal">■ ■ ■</span></div>
    <div>LEVEL <span id="levelVal">1</span></div>
</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

const W = 900, H = 680;
canvas.width  = W;
canvas.height = H;

// ── Constants ────────────────────────────────────────────────────────────────
const ROT_SPEED    = 0.055;   // rad/frame
const THRUST       = 0.14;
const MAX_SPEED    = 6.5;
const DRAG         = 0.988;
const BULLET_SPEED = 11;
const BULLET_LIFE  = 58;      // frames
const SHOOT_CD     = 14;      // frames between shots
const INVINCIBLE   = 200;     // frames of invincibility after a hit
const SHIP_RADIUS  = 14;

// ── State ────────────────────────────────────────────────────────────────────
let state; // 'title' | 'playing' | 'dead' | 'gameover'
let score, shields, level, asteroidCap;
let ship, bullets, asteroids, particles, debris;
let shootTimer, invTimer, levelTimer;
let stars;

const keys = {};
document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
        e.preventDefault();
    if (e.code === 'Enter' || e.code === 'Space') {
        if (state === 'title')   initGame();
        if (state === 'gameover') initGame();
    }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ── Helpers ──────────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function wrap(v, limit) {
    if (v < -80) return limit + 80;
    if (v > limit + 80) return -80;
    return v;
}
function dist2(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return dx*dx + dy*dy;
}

// ── Starfield ─────────────────────────────────────────────────────────────────
function makeStars() {
    stars = Array.from({length: 140}, () => ({
        x: rnd(0, W), y: rnd(0, H),
        r: Math.random() < 0.15 ? 1.5 : 0.8,
        a: rnd(0.3, 1),
    }));
}

// ── Asteroid factory ──────────────────────────────────────────────────────────
const SIZES = {
    large:  { r: 46, speed: [0.8, 1.6],  score: 20,  pts: 10 },
    medium: { r: 26, speed: [1.4, 2.4],  score: 50,  pts: 7  },
    small:  { r: 13, speed: [2.2, 3.4],  score: 100, pts: 5  },
};

function makeAsteroidShape(r) {
    const n = 9 + Math.floor(Math.random() * 5);
    return Array.from({length: n}, (_, i) => {
        const a = (i / n) * Math.PI * 2;
        const len = r * rnd(0.65, 1.0);
        return { x: Math.cos(a) * len, y: Math.sin(a) * len };
    });
}

function spawnAsteroid(size, x, y) {
    const info = SIZES[size];
    let ax = x, ay = y;
    if (ax === undefined) {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { ax = rnd(0, W);    ay = -60; }
        else if (edge === 1) { ax = W + 60;  ay = rnd(0, H); }
        else if (edge === 2) { ax = rnd(0, W); ay = H + 60; }
        else                 { ax = -60;     ay = rnd(0, H); }
    }
    const spd   = rnd(...info.speed) * (1 + level * 0.08);
    const angle = rnd(0, Math.PI * 2);
    asteroids.push({
        x: ax, y: ay,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        size,
        r: info.r,
        rot: rnd(0, Math.PI * 2),
        rotSpd: rnd(-0.025, 0.025),
        verts: makeAsteroidShape(info.r),
    });
}

// ── Particle factory ──────────────────────────────────────────────────────────
function burst(x, y, n, colors, speedScale = 1) {
    for (let i = 0; i < n; i++) {
        const a = rnd(0, Math.PI * 2);
        const s = rnd(0.5, 3.5) * speedScale;
        particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: rnd(30, 60),
            maxLife: 60,
            color: colors[Math.floor(Math.random() * colors.length)],
            r: rnd(1, 3),
        });
    }
}

function shipDebris(x, y, angle) {
    // Three triangular chunks fly off
    const lines = [
        [{x:20,y:0},{x:-14,y:12}],
        [{x:-14,y:12},{x:-8,y:0}],
        [{x:-8,y:0},{x:-14,y:-12}],
        [{x:-14,y:-12},{x:20,y:0}],
    ];
    lines.forEach(([a, b]) => {
        const va = Math.random() * Math.PI * 2;
        const sp = rnd(1, 3.5);
        debris.push({
            x, y,
            vx: Math.cos(va) * sp,
            vy: Math.sin(va) * sp,
            rot: angle,
            rotSpd: rnd(-0.08, 0.08),
            life: 120,
            ax: a.x, ay: a.y,
            bx: b.x, by: b.y,
        });
    });
}

// ── Init ──────────────────────────────────────────────────────────────────────
function initGame() {
    score      = 0;
    shields    = 3;
    level      = 1;
    asteroidCap = 8;
    shootTimer = 0;
    invTimer   = INVINCIBLE;
    levelTimer = 0;
    bullets    = [];
    asteroids  = [];
    particles  = [];
    debris     = [];

    ship = { x: W/2, y: H/2, angle: -Math.PI/2, vx: 0, vy: 0, thrusting: false };

    for (let i = 0; i < 5; i++) spawnAsteroid('large');
    state = 'playing';
}

makeStars();

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
    if (state === 'playing') updatePlaying();

    // Particles always fade
    particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        return --p.life > 0;
    });
    debris = debris.filter(d => {
        d.x += d.vx; d.y += d.vy;
        d.rot += d.rotSpd;
        return --d.life > 0;
    });
}

function updatePlaying() {
    // ── Rotate
    if (keys['ArrowLeft'])  ship.angle -= ROT_SPEED;
    if (keys['ArrowRight']) ship.angle += ROT_SPEED;

    // ── Thrust (Space)
    ship.thrusting = !!keys['Space'];
    if (ship.thrusting) {
        ship.vx += Math.cos(ship.angle) * THRUST;
        ship.vy += Math.sin(ship.angle) * THRUST;
        const spd = Math.hypot(ship.vx, ship.vy);
        if (spd > MAX_SPEED) { ship.vx = ship.vx/spd*MAX_SPEED; ship.vy = ship.vy/spd*MAX_SPEED; }

        // Exhaust flame particles
        if (Math.random() < 0.6) {
            const ba = ship.angle + Math.PI + rnd(-0.35, 0.35);
            particles.push({
                x: ship.x + Math.cos(ship.angle + Math.PI) * 16,
                y: ship.y + Math.sin(ship.angle + Math.PI) * 16,
                vx: Math.cos(ba) * rnd(1.5, 3) + ship.vx * 0.25,
                vy: Math.sin(ba) * rnd(1.5, 3) + ship.vy * 0.25,
                life: rnd(10, 20), maxLife: 20,
                color: Math.random() < 0.5 ? '#ff7700' : '#ffee44',
                r: rnd(1, 2.5),
            });
        }
    }

    ship.vx *= DRAG; ship.vy *= DRAG;
    ship.x = wrap(ship.x + ship.vx, W);
    ship.y = wrap(ship.y + ship.vy, H);

    // ── Shoot (S key)
    if (shootTimer > 0) shootTimer--;
    if (keys['KeyS'] && shootTimer === 0) {
        bullets.push({
            x: ship.x + Math.cos(ship.angle) * 22,
            y: ship.y + Math.sin(ship.angle) * 22,
            vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx * 0.4,
            vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy * 0.4,
            life: BULLET_LIFE,
        });
        shootTimer = SHOOT_CD;
    }

    // ── Move bullets
    bullets = bullets.filter(b => {
        b.x = wrap(b.x + b.vx, W);
        b.y = wrap(b.y + b.vy, H);
        return --b.life > 0;
    });

    // ── Move asteroids
    asteroids.forEach(a => {
        a.x = wrap(a.x + a.vx, W);
        a.y = wrap(a.y + a.vy, H);
        a.rot += a.rotSpd;
    });

    // ── Bullet ↔ Asteroid collisions
    outer:
    for (let i = bullets.length - 1; i >= 0; i--) {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const b = bullets[i], a = asteroids[j];
            if (dist2(b.x, b.y, a.x, a.y) < a.r * a.r) {
                score += SIZES[a.size].score;
                burst(a.x, a.y, 10, ['#aaa', '#ccc', '#888', '#fff']);

                if (a.size === 'large') {
                    spawnAsteroid('medium', a.x + rnd(-15, 15), a.y + rnd(-15, 15));
                    spawnAsteroid('medium', a.x + rnd(-15, 15), a.y + rnd(-15, 15));
                } else if (a.size === 'medium') {
                    spawnAsteroid('small', a.x + rnd(-8, 8), a.y + rnd(-8, 8));
                    spawnAsteroid('small', a.x + rnd(-8, 8), a.y + rnd(-8, 8));
                }

                asteroids.splice(j, 1);
                bullets.splice(i, 1);
                continue outer;
            }
        }
    }

    // ── Ship ↔ Asteroid collision
    if (invTimer > 0) {
        invTimer--;
    } else {
        for (let j = asteroids.length - 1; j >= 0; j--) {
            const a = asteroids[j];
            if (dist2(ship.x, ship.y, a.x, a.y) < (SHIP_RADIUS + a.r * 0.7) ** 2) {
                shields--;
                invTimer = INVINCIBLE;
                burst(ship.x, ship.y, 22, ['#ff4400', '#ff8800', '#ffcc00', '#fff']);

                // Bounce asteroid away
                const ang = Math.atan2(ship.y - a.y, ship.x - a.x);
                asteroids[j].vx = Math.cos(ang + Math.PI) * 2.5;
                asteroids[j].vy = Math.sin(ang + Math.PI) * 2.5;

                if (shields <= 0) {
                    burst(ship.x, ship.y, 40, ['#ff2200','#ff6600','#ffaa00','#fff']);
                    shipDebris(ship.x, ship.y, ship.angle);
                    state = 'dead';
                    setTimeout(() => { state = 'gameover'; }, 2500);
                }
                break;
            }
        }
    }

    // ── Level progression: keep asteroid count healthy
    if (asteroids.length < asteroidCap) {
        // Only spawn if a minimum gap since last spawn (avoid clustering)
        if (Math.random() < 0.008) spawnAsteroid('large');
    }

    levelTimer++;
    if (levelTimer > 1800) { // every 30 s
        levelTimer = 0;
        level++;
        asteroidCap = Math.min(8 + level * 2, 22);
    }
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function drawStars() {
    stars.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawShip() {
    if (state !== 'playing' && state !== 'dead') return;
    if (state === 'dead') return;
    // Blink during invincibility
    if (invTimer > 0 && Math.floor(invTimer / 7) % 2 === 0) return;

    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.angle);

    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur  = 12;
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth   = 2;

    // Hull
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-14, 13);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-14, -13);
    ctx.closePath();
    ctx.stroke();

    // Cockpit dome
    ctx.beginPath();
    ctx.arc(6, 0, 4.5, 0, Math.PI * 2);
    ctx.strokeStyle = '#88eeff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Wing accent lines
    ctx.strokeStyle = '#0099cc';
    ctx.lineWidth = 1;
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-10, 9);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(-10, -9); ctx.stroke();

    ctx.restore();
}

function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    ctx.strokeStyle = '#9999aa';
    ctx.lineWidth   = 2;
    ctx.shadowColor = '#556';
    ctx.shadowBlur  = 5;

    ctx.beginPath();
    ctx.moveTo(a.verts[0].x, a.verts[0].y);
    for (let i = 1; i < a.verts.length; i++)
        ctx.lineTo(a.verts[i].x, a.verts[i].y);
    ctx.closePath();
    ctx.stroke();

    ctx.restore();
}

function drawBullets() {
    bullets.forEach(b => {
        ctx.save();
        ctx.shadowColor = '#ffff44';
        ctx.shadowBlur  = 8;
        ctx.fillStyle   = '#ffff88';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle   = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur  = 4;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
}

function drawDebris() {
    debris.forEach(d => {
        ctx.save();
        ctx.globalAlpha = d.life / 120;
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rot);
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth   = 2;
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur  = 8;
        ctx.beginPath();
        ctx.moveTo(d.ax, d.ay);
        ctx.lineTo(d.bx, d.by);
        ctx.stroke();
        ctx.restore();
    });
    ctx.globalAlpha = 1;
}

function drawOverlay() {
    ctx.textAlign = 'center';
    ctx.shadowBlur = 0;

    if (state === 'title') {
        // Dim background
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 30;
        ctx.font = 'bold 56px Courier New';
        ctx.fillText('ASTEROID FIELD', W/2, H/2 - 70);

        ctx.shadowBlur = 0;
        ctx.font = '18px Courier New';
        ctx.fillStyle = '#8899cc';
        ctx.fillText('← →   Rotate ship', W/2, H/2 - 10);
        ctx.fillText('SPACE  Thrust', W/2, H/2 + 18);
        ctx.fillText('S      Fire', W/2, H/2 + 46);

        ctx.font = 'bold 22px Courier New';
        ctx.fillStyle = '#ffffff';
        const blink = Math.floor(Date.now() / 600) % 2 === 0;
        if (blink) ctx.fillText('PRESS ENTER OR SPACE TO LAUNCH', W/2, H/2 + 100);
    }

    if (state === 'gameover') {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = '#ff4400';
        ctx.shadowColor = '#ff4400';
        ctx.shadowBlur = 25;
        ctx.font = 'bold 52px Courier New';
        ctx.fillText('SHIP DESTROYED', W/2, H/2 - 60);

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffffff';
        ctx.font = '26px Courier New';
        ctx.fillText(`FINAL SCORE: ${score}`, W/2, H/2);
        ctx.fillText(`LEVEL REACHED: ${level}`, W/2, H/2 + 40);

        ctx.font = 'bold 20px Courier New';
        ctx.fillStyle = '#aaaacc';
        const blink = Math.floor(Date.now() / 600) % 2 === 0;
        if (blink) ctx.fillText('PRESS ENTER TO TRY AGAIN', W/2, H/2 + 100);
    }

    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
}

function updateHUD() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('levelVal').textContent  = level;
    const icons = ['□ □ □','■ □ □','■ ■ □','■ ■ ■'];
    document.getElementById('shieldsVal').textContent = icons[Math.max(0, shields)];
}

// ── Game loop ─────────────────────────────────────────────────────────────────
function loop() {
    update();

    ctx.fillStyle = '#00000e';
    ctx.fillRect(0, 0, W, H);

    drawStars();
    drawParticles();
    drawDebris();
    asteroids.forEach(drawAsteroid);
    drawBullets();
    drawShip();
    drawOverlay();

    if (state !== 'title') updateHUD();

    requestAnimationFrame(loop);
}

state = 'title';
score = 0; shields = 3; level = 1;
asteroids = []; bullets = []; particles = []; debris = [];
loop();
</script>
</body>
</html>
